<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنتِ كل حاجة ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #16000d, #4b001f, #18000e);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .hearts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      bottom: -50px;
      color: #ff5c9d;
      font-size: 22px;
      animation: floatUp linear infinite;
      opacity: .8;
      filter: drop-shadow(0 0 8px #ff4f91);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: .9;
      }

      100% {
        transform: translateY(-115vh) rotate(360deg);
        opacity: 0;
      }
    }

    .card {
      width: min(90%, 430px);
      padding: 35px 25px;
      text-align: center;
      border-radius: 30px;
      background: rgba(255, 255, 255, .09);
      border: 1px solid rgba(255, 255, 255, .2);
      backdrop-filter: blur(12px);
