<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>رسالة من أحمد إلى شروق</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0 12px 30px;

            background:
                radial-gradient(
                    circle at top,
                    #fff7fa,
                    #ffe7ef 50%,
                    #fff4f7
                );

            color: #653345;
            font-family: "Cairo", Arial, sans-serif;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }


        /* =========================
           شاشة كلمة السر
        ========================= */

        #passwordScreen {
            position: fixed;
            inset: 0;
            z-index: 20000;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #ffe2eb,
                    #fff7f9,
                    #ffd8e5
                );
        }

        .password-box {
            width: 100%;
            max-width: 390px;

            background: rgba(255,255,255,.96);

            padding: 35px 25px;

            border-radius: 28px;

            text-align: center;

            box-shadow:
                0 12px 40px rgba(180,60,100,.18);
        }

        .password-lock {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .password-box h2 {
            margin: 0 0 8px;

            color: #c92f61;

            font-size: 27px;
        }

        .password-box p {
            color: #8c596b;
            margin-bottom: 20px;
        }

        #passwordInput {
            width: 100%;

            padding: 14px;

            border: 2px solid #f2b4c7;

            border-radius: 14px;

            outline: none;

            font-size: 17px;

            text-align: center;

            font-family: "Cairo", sans-serif;
        }

        #passwordInput:focus {
            border-color: #d94b78;
        }

        #enterButton {
            width: 100%;

            margin-top: 14px;

            padding: 14px;

            border: none;

            border-radius: 14px;

            background: #d94b78;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }

        #errorMessage {
            display: none;

            margin-top: 12px;

            color: #d42e61;

            font-weight: bold;
        }


        /* =========================
           شاشة الافتتاح
        ========================= */

        #opening {
            position: fixed;
            inset: 0;

            z-index: 10000;

            display: none;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #fff2f6,
                    #ffe1eb,
                    #fff7f9
                );
        }

        #opening.hide {
            animation:
                openingFade 1s ease forwards;
        }

        .opening-content {
            width: 90%;
            max-width: 600px;

            text-align: center;

            font-family: "Aref Ruqaa", serif;

            color: #8f3455;
        }

            opacity: 0;

            transform: translateY(18px);

            margin: 4px 0;

            font-size: 25px;

            line-height: 1.8;
